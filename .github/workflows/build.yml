name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: Create a draft release tagged v<version> from res/app.rc
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          $rc = Get-Content res/app.rc -Raw
          $parts = 'MAJOR', 'MINOR', 'PATCH' | ForEach-Object {
            if ($rc -notmatch "#define YAMI_VERSION_$_ (\d+)") { throw "YAMI_VERSION_$_ not found in res/app.rc" }
            $Matches[1]
          }
          $version = $parts -join '.'
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: Yami-${{ steps.version.outputs.tag }}
          path: build/Yami.exe

      - name: Draft release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$env:TAG" build/Yami.exe --draft --title "Yami $env:TAG" --target "$env:GITHUB_SHA" --generate-notes
