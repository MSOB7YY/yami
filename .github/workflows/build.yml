name: build

on:
  push:
    branches: [main]
    paths: [src/version.h]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          $header = Get-Content src/version.h -Raw
          $parts = 'MAJOR', 'MINOR', 'PATCH' | ForEach-Object {
            if ($header -notmatch "#define YAMI_VERSION_$_ (\d+)") { throw "YAMI_VERSION_$_ not found in src/version.h" }
            $Matches[1]
          }
          $tag = 'v' + ($parts -join '.')
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          $isNew = if ($existingTag) { 'false' } else { 'true' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "isNew=$isNew" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: Yami-${{ steps.version.outputs.tag }}
          path: build/Yami.exe

      - name: Release
        if: steps.version.outputs.isNew == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$env:TAG" build/Yami.exe --title "Yami $env:TAG" --target "$env:GITHUB_SHA" --generate-notes
